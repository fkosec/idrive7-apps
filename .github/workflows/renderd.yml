# Builds the apps' GPU renderer (kit/renderd: mgu-renderd and the controller gate) in its Ubuntu 18.04 container and
# runs its tests, on branches other than main and by hand. The binaries are kept as the run's artifact, to be
# committed as kit/renderd/prebuilt/ (with SOURCE_SHA256 from kit/tools/make_kit.py). On a renderd-* branch the
# run commits them there itself, so the branch can be merged with its binary. Publishes nothing.
name: Renderer

on:
  push:
    branches-ignore: [main]
    paths: ["kit/renderd/**", ".github/workflows/renderd.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build (Ubuntu 18.04 container)
        working-directory: kit/renderd
        run: |
          docker build -q -t mgu-renderd-build docker >/dev/null
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/src" -w /src mgu-renderd-build make
          ls -l build
      - name: Check the binary
        working-directory: kit/renderd
        run: make check-target
      - name: Tests
        working-directory: kit/renderd
        run: make test
      - uses: actions/upload-artifact@v4
        with:
          name: mgu-renderd
          path: |
            kit/renderd/build/mgu-renderd
            kit/renderd/build/mgu-inputgate.so
      - name: Commit the binaries (renderd-* branches)
        if: github.event_name == 'push' && startsWith(github.ref_name, 'renderd-')
        run: |
          cp kit/renderd/build/mgu-renderd kit/renderd/build/mgu-inputgate.so kit/renderd/prebuilt/
          python3 -c "import sys; sys.path.insert(0, 'kit/tools'); import make_kit as m; open(m.PRE_SUM, 'w').write(m.source_hash() + '\n# sha256 of kit/renderd src/, inputgate/*.cpp, protocol/*.xml, docker/, Makefile (make_kit.py source_hash) this binary was built from\n')"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kit/renderd/prebuilt
          git diff --cached --quiet || { git commit -m "kit renderer binary built by CI from ${GITHUB_SHA::7}"; git push; }
